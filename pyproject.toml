[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-ecg"
version = "0.0.1"
requires-python = "~=3.11.0"
description = "Estimate laboratory blood parameters from ECG signals"
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "torch",
  "torchvision",
  "torchmetrics",
  "pytorch-lightning==2.4.0",
  "pyyaml==6.0.2",
  "matplotlib==3.8.0",
  "numpy==1.26.0",
  "pandas==2.1.1",
  "scikit-learn==1.3.0",
  "h5py==3.11.0",
  "scipy==1.14.1",
  "tables==3.10.1",
  "wfdb>=4.1.2",
  "catabra-lib>=0.0.3",
  "catabra-pandas>=0.0.8",
]

[project.urls]
Repository = "https://github.com/risc-mi/lab-ecg"

[tool.uv]
environments = ["python_version == '3.11'"]

[[tool.uv.index]]
# The cuda version specified here must match the one of `FROM_IMAGE` specified in `.devcontainer/docker-compose.yml`.
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# The cuda version specified here must match the one of `FROM_IMAGE` specified in `.devcontainer/docker-compose.yml`.
torch = [
  {index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]
torchvision = [
  {index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]
torchmetrics = [
  {index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'"}
]

[tool.hatch.build.targets.sdist]
include = ["lab_ecg"]

[tool.hatch.build.targets.wheel]
include = ["lab_ecg"]

[dependency-groups]
dev = [
  "pip>=26.0.1",
  "ruff>=0.16.0",
  "ipykernel"
]

[tool.black]
# https://black.readthedocs.io/en/stable/usage_and_configuration/the_basics.html#configuration-via-a-file
line-length = 120
target-version = ["py311"]

[tool.isort]
# https://pycqa.github.io/isort/docs/configuration/config_files
profile = "black"
line_length = 120

[tool.pytest.ini_options]
# https://docs.pytest.org/en/7.1.x/reference/customize.html
addopts = "--color=yes --doctest-modules  -ra --cov --cov-report=html --cov-report term --cov-report xml:coverage.xml --exitfirst --failed-first --strict-config --strict-markers --verbosity=2 --junitxml=python-junit.xml"
xfail_strict = true
pythonpath = ["lab_ecg"]
testpaths = ["lab_ecg"]
# ignore any of these paths
norecursedirs = [ ]

[tool.ruff]
# https://github.com/charliermarsh/ruff
fix = true
line-length = 120
src = ["lab_ecg"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.pydocstyle]
convention = "numpy"
